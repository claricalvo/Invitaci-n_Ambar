<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#69eaff">
  <title>Mis XV · Ámbar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>

  <main class="page">

    <!-- PORTADA -->
    <section class="cover">
      <canvas class="ball ball--top" data-size="170" data-seed="7" aria-hidden="true"></canvas>
      <canvas class="ball ball--bottom" data-size="120" data-seed="19" aria-hidden="true"></canvas>

      <h2 class="cover__kicker">Mis XV</h2>
      <div class="cover__photo">
        <img src="ambar.png" alt="Ámbar con gorro de fiesta celeste y anteojos de sol">
      </div>
      <h1 class="cover__name">ÁMBAR</h1>
    </section>

    <!-- FECHA -->
    <section class="block reveal">
      <p class="block__small">Lunes</p>
      <p class="date__day">07</p>
      <p class="date__month">Diciembre</p>
      <p class="block__small">2026</p>
    </section>

    <!-- LUGAR Y HORARIO -->
    <section class="block reveal">
      <svg class="icon" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 44s-13-13.2-13-23a13 13 0 0 1 26 0c0 9.800-13 23-13 23z"/>
        <circle cx="24" cy="21" r="5"/>
      </svg>
      <h3 class="block__title">Lugar</h3>
      <p class="block__big">Bellavista 2</p>
      <div class="rule" aria-hidden="true"><span></span></div>
      <h3 class="block__title">Horario</h3>
      <p class="block__big">21 hs a 5 am</p>
    </section>

    <!-- DRESS CODE -->
    <section class="block reveal">
      <h3 class="block__title">Dress code</h3>
      <p class="block__big">Elegante</p>
      <p class="block__text">Para acompañarme en esta noche,<br>no vale vestir de:</p>
      <ul class="colors">
        <li><span class="swatch swatch--blue"></span><em>Azul</em></li>
        <li><span class="swatch swatch--green"></span><em>Verde</em></li>
        <li><span class="swatch swatch--silver"></span><em>Plateado</em></li>
      </ul>
    </section>

    <!-- CONFIRMACIÓN -->
    <section class="block block--last reveal">
      <svg class="icon" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 4l4.200 13.800L42 22l-13.800 4.200L24 40l-4.200-13.800L6 22l13.800-4.200z"/>
      </svg>
      <h3 class="block__title">Confirmá tu asistencia</h3>
      <p class="block__text">Avisale a Ámbar o a su familia<br>si vas a acompañarla.</p>
      <p class="sign">Te espero</p>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
